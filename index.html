
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Computing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container"

<div class="card" id="authSection">
    <h2>Account Login</h2>

    <label>Email Address</label>
    <input
        type="email"
        id="email"
        placeholder="Enter your email"
    >

    <label>Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
    >

    <button type="button" onclick="registerUser()" class="save">
        Register
    </button>

    <button type="button" onclick="loginUser()" class="compute">
        Login
    </button>

    <button type="button" onclick="logoutUser()" class="clear">
        Logout
    </button>

    <p id="authMessage"></p>
</div>
>

    <h1>GRADE COMPUTING SYSTEM</h1>
    <p class="subtitle">Student Grade Management System</p>

    <div class="card">
        <h2>Student Information</h2>

        <label>Student ID</label>
        <input type="text" id="studentId" placeholder="Enter Student ID">

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter Student Name">
    </div>

    <div class="card">
        <h2>Grade Information</h2>

        <label>Prelim Grade</label>
        <input type="number" id="prelim" placeholder="Enter Prelim" min="0" max="100">

        <label>Midterm Grade</label>
        <input type="number" id="midterm" placeholder="Enter Midterm" min="0" max="100">

        <label>Final Grade</label>
        <input type="number" id="final" placeholder="Enter Final" min="0" max="100">

        <button type="button" class="compute" onclick="computeGrade()">
            Compute Grade
        </button>
    </div>

    <div class="card">
        <h2>Grade Result</h2>

        <label>General Average</label>
        <input type="text" id="average" readonly placeholder="Average">

        <label>Remarks</label>
        <input type="text" id="remarks" readonly placeholder="Remarks">
        
        <button type="button" class="save" id="saveBtn" onclick="saveStudent()">
            Save Student
        </button>

        <button type="button" class="clear" onclick="clearForm()">
            Clear Form
        </button>
    </div>

    <div class="card">
        <h2>Saved Students</h2>
        <button type="button" class="view" onclick="loadStudents()">
            View Students
        </button>
        <div id="studentList"></div>
    </div>

    <footer>Grade Computing System © 2026</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
